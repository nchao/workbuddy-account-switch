[package]
name = "workbuddy-account-switcher"
version = "0.1.0"
edition = "2024"
description = "macOS GUI to snapshot and switch WorkBuddy account login states"
license = "MIT"
readme = "README.md"

[[bin]]
name = "wbswitch-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ttf-parser = "0.25.1"
